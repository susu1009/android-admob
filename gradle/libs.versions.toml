[versions]
# Same AGP/Kotlin as consumer apps (see android-iap): compiled with Kotlin 2.0 so any app on
# Kotlin >= 2.0 can read the metadata.
# GMA pinned to 24.8.0, the last release whose Kotlin metadata is 2.1 (readable by Kotlin 2.0).
# 24.9–25.2 ship 2.2 metadata (apps need Kotlin >= 2.1), 25.3+ ship 2.3 (Kotlin >= 2.2); otherwise
# the app fails with "binary version of its metadata is 2.x.0, expected version is 2.0.0".
# Apps on a newer Kotlin may declare a newer play-services-ads themselves; Gradle picks the higher one.
agp = "8.7.3"
kotlin = "2.0.21"
playServicesAds = "24.8.0"
ump = "4.0.0"
coreKtx = "1.15.0"
appcompat = "1.7.0"
lifecycle = "2.8.7"
composeBom = "2024.12.01"
activityCompose = "1.9.3"
kotlinxCoroutines = "1.9.0"
junit = "4.13.2"

[libraries]
play-services-ads = { group = "com.google.android.gms", name = "play-services-ads", version.ref = "playServicesAds" }
ump = { group = "com.google.android.ump", name = "user-messaging-platform", version.ref = "ump" }
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
androidx-lifecycle-process = { group = "androidx.lifecycle", name = "lifecycle-process", version.ref = "lifecycle" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-foundation = { group = "androidx.compose.foundation", name = "foundation" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-activity = { group = "androidx.activity", name = "activity", version.ref = "activityCompose" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "kotlinxCoroutines" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
junit = { group = "junit", name = "junit", version.ref = "junit" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
